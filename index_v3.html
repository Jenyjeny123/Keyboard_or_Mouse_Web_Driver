<!DOCTYPE html>
<html lang="zh-CN" data-version="3.1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SwiftKey X1 - V3 架构 (完整 UI 组件版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0f; color: #e2e8f0; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(6, 182, 212, 0.2); }
        /* 键盘按键 - 真实机械键盘样式 (来自原程序) */
        .kbd-key {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 3.5rem; height: 3.5rem; padding: 0 0.75rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.5),
                0 2px 4px -1px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 0.5rem;
            font-family: monospace; font-size: 1.125rem; font-weight: 500;
            color: #cbd5e1;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        /* 悬停动画 - 抬起 + 放大 + 发光 */
        .kbd-key:hover {
            transform: translateY(-4px) scale(1.05);
            background: linear-gradient(145deg, #0891b2, #0e7490);
            color: white;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow:
                0 15px 25px -5px rgba(0, 0, 0, 0.6),
                0 10px 10px -5px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(6, 182, 212, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        /* 按下动画 - 下沉 */
        .kbd-key:active {
            transform: translateY(2px);
            box-shadow:
                0 0 20px rgba(6, 182, 212, 0.6),
                inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        /* 选中状态 - 边框发光 */
        .kbd-key.active {
            border: 2px solid #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
            background: linear-gradient(145deg, #0891b2, #0e7490);
            color: white;
        }

        /* Grid 键盘布局 - Enter 跨 2 行 */
        #keymapGrid {
            display: grid;
            grid-template-columns: repeat(4, 4rem);
            grid-template-rows: repeat(4, 3.5rem);
            gap: 0.625rem;
            width: fit-content;
            margin: 0 auto;
        }
        #keymapGrid .kbd-key { width: 100%; min-width: 0; }
        #keymapGrid .enter-key {
            grid-row: 3 / 5;
            grid-column: 4;
            height: 100%;
        }
        /* LED 键盘布局 */
        #ledKeymapGrid {
            display: grid;
            grid-template-columns: repeat(4, 4rem);
            grid-template-rows: repeat(4, 3.5rem);
            gap: 0.625rem;
            width: fit-content;
            margin: 0 auto;
        }
        .led-key {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.5),
                0 2px 4px -1px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(71, 85, 105, 0.3);
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.875rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .led-key:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 15px -5px rgba(0, 0, 0, 0.6),
                0 0 15px rgba(6, 182, 212, 0.3);
        }
        .led-key.enter-key {
            grid-row: 3 / 5;
            grid-column: 4;
            height: 100%;
        }
        input[type="range"].slider {
            -webkit-appearance: none; appearance: none; background: transparent;
        }
        input[type="range"].slider::-webkit-slider-runnable-track {
            background: #334155; border-radius: 9999px; height: 6px;
        }
        input[type="range"].slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 16px; height: 16px; border-radius: 9999px;
            background: #06b6d4; cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }
        input[type="range"].slider::-moz-range-track { background: #334155; border-radius: 9999px; height: 6px; }
        input[type="range"].slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #06b6d4; border: none; cursor: pointer; box-shadow: 0 0 8px rgba(6, 182, 212, 0.5); }
    </style>
</head>
<body class="min-h-screen p-6">
    <!-- 设备连接初始界面 (来自原程序) -->
    <div id="connectionScreen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
        <div class="glass-panel rounded-2xl p-8 max-w-md w-full text-center">
            <div class="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <rect x="4" y="6" width="3" height="2" rx="0.5"/>
                    <rect x="8" y="6" width="3" height="2" rx="0.5"/>
                    <rect x="13" y="6" width="3" height="2" rx="0.5"/>
                    <rect x="17" y="6" width="3" height="2" rx="0.5"/>
                    <rect x="4" y="9" width="3" height="2.5" rx="0.5"/>
                    <rect x="8" y="9" width="3" height="2.5" rx="0.5"/>
                    <rect x="13" y="9" width="3" height="2.5" rx="0.5"/>
                    <rect x="17" y="9" width="3" height="2.5" rx="0.5"/>
                    <rect x="4" y="12.5" width="3" height="2.5" rx="0.5"/>
                    <rect x="8" y="12.5" width="8" height="2.5" rx="0.5"/>
                    <rect x="17" y="12.5" width="3" height="2.5" rx="0.5"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">SwiftKey X1</h2>
            <p class="text-slate-400 mb-6">请连接您的键盘设备</p>

            <div class="mb-6">
                <div class="flex gap-2 mb-4">
                    <button id="searchBtn" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-xl transition-colors">
                        搜索设备
                    </button>
                    <button id="connectBtn" onclick="directConnect()" class="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-xl transition-colors">
                        直接连接
                    </button>
                </div>
                <div id="deviceList" class="max-h-48 overflow-y-auto rounded-lg bg-slate-900/50 border border-slate-800 mb-4">
                    <div class="p-4 text-center text-slate-500 text-sm">
                        点击上方按钮搜索设备
                    </div>
                </div>
            </div>

            <p class="text-xs text-slate-500">支持设备: SwiftKey X1 (VID: 320F, PID: 1234)</p>
        </div>
    </div>

    <!-- 主应用界面 (连接后显示) -->
    <div id="mainApp" class="hidden">
        <!-- 顶部导航 (来自原程序) -->
        <header class="glass-panel sticky top-0 z-50 border-b border-slate-800 h-16 flex items-center px-6">
            <div class="flex items-center gap-3 flex-shrink-0">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <rect x="4" y="6" width="3" height="2" rx="0.5"/>
                        <rect x="8" y="6" width="3" height="2" rx="0.5"/>
                        <rect x="13" y="6" width="3" height="2" rx="0.5"/>
                        <rect x="17" y="6" width="3" height="2" rx="0.5"/>
                        <rect x="4" y="9" width="3" height="2.5" rx="0.5"/>
                        <rect x="8" y="9" width="3" height="2.5" rx="0.5"/>
                        <rect x="13" y="9" width="3" height="2.5" rx="0.5"/>
                        <rect x="17" y="9" width="3" height="2.5" rx="0.5"/>
                        <rect x="4" y="12.5" width="3" height="2.5" rx="0.5"/>
                        <rect x="8" y="12.5" width="8" height="2.5" rx="0.5"/>
                        <rect x="17" y="12.5" width="3" height="2.5" rx="0.5"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">SwiftKey <span class="text-cyan-400">X1</span></h1>
                    <p class="text-xs text-slate-400 mono">有线单模键盘驱动 V3.0.0</p>
                </div>
            </div>

            <div class="flex items-center gap-4 ml-auto">
                <select id="profileSelect" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-cyan-500">
                    <option>Profile 1 (默认)</option>
                    <option>Profile 2</option>
                    <option>Profile 3</option>
                    <option>Profile 4</option>
                </select>
                <button id="resetAllBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors">
                    重置全部
                </button>
                <div id="themeToggle"></div>
                <div class="w-px h-8 bg-slate-700"></div>
                <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-900/50 border border-slate-700">
                    <div class="relative w-3 h-3">
                        <div id="statusDot" class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    </div>
                    <span id="statusText" class="text-sm font-medium text-emerald-400">已连接</span>
                    <span class="text-xs text-slate-500 mono ml-2">USB-C</span>
                    <button id="disconnectBtn" class="ml-2 px-2 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors">
                        断开
                    </button>
                </div>
            </div>
        </header>

        <div class="flex" style="height: calc(100vh - 64px);">
            <!-- 侧边栏导航 (来自原程序) -->
            <aside class="w-64 glass-panel border-r border-slate-800 flex-shrink-0 flex flex-col">
                <nav class="p-4 space-y-2 flex-1 overflow-y-auto" id="mainTabs"></nav>
                <!-- 底部操作区 (动态: 连接/断开) -->
                <div class="p-4 border-t border-slate-800" id="sidebarFooter"></div>
            </aside>

            <!-- 主内容区域 (滚动) -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="tabContents">
            <!-- 设备管理 Tab -->
            <div data-tab="device" class="space-y-6">
                <div class="grid grid-cols-1 gap-6">
                    <div id="devicePanel"></div>
                </div>
            </div>

            <!-- 灯光控制 Tab -->
            <div data-tab="lighting" class="space-y-6 hidden">
                <!-- LED 预览 + 颜色选择 左右布局 -->
                <div class="flex gap-4 items-start">
                    <div id="lightingVisualPanel" class="flex-1"></div>
                    <div id="colorPickerPanel" class="w-48 shrink-0"></div>
                </div>
                <!-- 灯光控制在下 -->
                <div id="lightingControlPanel"></div>
            </div>

            <!-- 按键映射 Tab -->
            <div data-tab="keymap" class="space-y-6 hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2" id="keymapPanel"></div>
                    <div id="keymapConfigPanel"></div>
                </div>
            </div>

            <!-- 性能设置 Tab -->
            <div data-tab="performance" class="space-y-6 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="performancePanel"></div>
            </div>

            <!-- 数据测试 Tab -->
            <div data-tab="test" class="space-y-6 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div id="testConfigPanel"></div>
                    <div id="testStatsPanel"></div>
                </div>
                <div id="testLogPanel"></div>
            </div>
        </div>
            </div>
        </div>
    </div>
    </div>

    <script type="module">
        // ==================== 导入所有模块 ====================
        import { bus } from './src/core/EventBus.js';
        import { logger } from './src/core/Logger.js';
        import { Protocol } from './src/protocol/Protocol.js';
import { WebHIDTransport } from './src/transport/WebHIDTransport.js';
import { DeviceService, DeviceStatus, DeviceType } from './src/services/DeviceService.js';
        import { LightingService, LightMode } from './src/services/LightingService.js';
        import { TestService, TestDataType, TestStatus } from './src/services/TestService.js';
        import { CMD } from './src/protocol/commands/BaseCommands.js';
        import { Panel } from './src/ui/components/Panel.js';
        import { Modal, confirm } from './src/ui/components/Modal.js';
        import { toast } from './src/ui/components/Toast.js';
        import { Tabs } from './src/ui/components/Tabs.js';
        import { theme, ThemeToggle } from './src/ui/components/Theme.js';
        import { Button } from './src/ui/components/Button.js';
        import { Input } from './src/ui/components/Input.js';
        import { Select } from './src/ui/components/Select.js';
        import { Slider } from './src/ui/components/Slider.js';
        import { Switch } from './src/ui/components/Switch.js';

        // ==================== 初始化服务 ====================
        const deviceService = new DeviceService();
        let protocol = null;
        let lighting = null;
        let test = null;

        // ==================== 工具 ====================
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        function updateStatusBadge(text, color = 'emerald-400', dotColor = 'emerald-500') {
            statusText.textContent = text;
            statusText.className = `text-sm font-medium text-${color}`;
            statusDot.className = `w-3 h-3 rounded-full bg-${dotColor}`;
        }

        // ==================== Tabs (侧边栏导航) ====================
        const mainTabs = new Tabs({
            tabs: [
                { id: 'device', label: '设备管理', icon: '🔌' },
                { id: 'lighting', label: '灯光效果', icon: '💡' },
                { id: 'keymap', label: '按键映射', icon: '⌨️' },
                { id: 'performance', label: '性能调节', icon: '⚡' },
                { id: 'test', label: '数据测试', icon: '📊' },
            ],
            active: 'device',
            variant: 'vertical',  // 垂直布局
            onChange: (id) => {
                document.querySelectorAll('[data-tab]').forEach(el => {
                    el.classList.toggle('hidden', el.dataset.tab !== id);
                });
            },
        });
        mainTabs.mount('#mainTabs');

        // ==================== 设备管理面板 (合并真实/模拟按钮 + 设备信息) ====================
        // 注: 断开/退出按钮已移至侧边栏底部
        const devicePanel = new Panel({
            title: '🔌 设备管理',
            subtitle: '连接真实设备 / 模拟模式 / 查看设备信息',
            content: `
                <div id="deviceInfoContent" class="text-sm text-slate-400 text-center py-6">未连接设备</div>
                <div class="mt-3 text-xs text-slate-500">
                    💡 真实设备需要 Chrome/Edge 浏览器 + HTTPS
                </div>
            `,
        });
        devicePanel.mount('#devicePanel');

        // ==================== 侧边栏底部操作区 ====================
        const sidebarFooter = document.getElementById('sidebarFooter');

        function updateSidebarFooter() {
            const status = deviceService.getStatus();

            if (status === 'disconnected') {
                sidebarFooter.innerHTML = `
                    <button onclick="directConnect()" class="w-full px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition flex items-center justify-center gap-2 text-sm">
                        🔌 连接设备
                    </button>
                `;
            } else if (status === 'connected') {
                sidebarFooter.innerHTML = `
                    <button id="btnDisconnectSidebar" class="w-full px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-lg transition flex items-center justify-center gap-2 text-sm">
                        🔌 断开设备
                    </button>
                `;
                document.getElementById('btnDisconnectSidebar').onclick = async () => {
                    await deviceService.disconnect();
                    toast.info('设备已断开');
                };
            } else {
                sidebarFooter.innerHTML = '';
            }
        }
        updateSidebarFooter();

        // ==================== 设备信息更新 ====================
        function updateInfoPanel() {
            const info = deviceService.deviceInfo;
            const el = document.getElementById('deviceInfoContent');
            if (!el) return;
            if (!info) {
                el.innerHTML = `<div class="text-sm text-slate-400 text-center py-6">未连接设备</div>`;
                return;
            }
            el.innerHTML = `
                <div class="grid grid-cols-2 gap-3 text-sm text-left">
                    <div><span class="text-slate-400">名称:</span> <span class="text-cyan-400">${info.productName || 'N/A'}</span></div>
                    <div><span class="text-slate-400">类型:</span> <span class="text-cyan-400">${info.type || 'unknown'}</span></div>
                    <div><span class="text-slate-400">VID:</span> <span class="text-cyan-400">0x${(info.vendorId || 0).toString(16).padStart(4, '0')}</span></div>
                    <div><span class="text-slate-400">PID:</span> <span class="text-cyan-400">0x${(info.productId || 0).toString(16).padStart(4, '0')}</span></div>
                    <div class="col-span-2">
                        <span class="text-slate-400">连接方式:</span>
                        <span class="text-emerald-400">🔌 USB HID</span>
                    </div>
                    <div class="col-span-2"><span class="text-slate-400">状态:</span> <span class="text-emerald-400">${deviceService.getStatus()}</span></div>
                </div>
            `;
        }

        // ==================== 设备操作 ====================
        const connectionScreen = document.getElementById('connectionScreen');
        const mainApp = document.getElementById('mainApp');
        const deviceList = document.getElementById('deviceList');

        // 切换到主应用界面
        function enterMainApp() {
            connectionScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');
        }

        // 返回连接界面
        window.returnToConnection = function() {
            connectionScreen.classList.remove('hidden');
            mainApp.classList.add('hidden');
            deviceService.disconnect();
        };

        // 搜索设备
        document.getElementById('searchBtn').onclick = async () => {
            deviceList.innerHTML = `<div class="p-4 text-center text-slate-400 text-sm">🔍 正在搜索...</div>`;
            try {
                const devices = await deviceService.searchDevices();
                if (devices.length === 0) {
                    deviceList.innerHTML = `
                        <div class="p-4 text-center text-amber-400 text-sm">
                            ⚠️ 未发现已授权设备
                            <div class="text-xs text-slate-500 mt-2">请先点击「直接连接」授权设备</div>
                        </div>`;
                } else {
                    deviceList.innerHTML = devices.map((d, i) => `
                        <div class="device-item p-3 hover:bg-slate-800/50 cursor-pointer border-b border-slate-800 last:border-b-0 text-left"
                             data-index="${i}">
                            <div class="text-sm text-slate-200">${d.productName || 'Unknown Device'}</div>
                            <div class="text-xs text-slate-500 mono">VID: 0x${(d.vendorId||0).toString(16).padStart(4,'0')} | PID: 0x${(d.productId||0).toString(16).padStart(4,'0')}${d.opened ? ' | <span class="text-amber-400">已打开</span>' : ''}</div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                deviceList.innerHTML = `<div class="p-4 text-center text-red-400 text-sm">❌ 搜索失败: ${err.message}</div>`;
            }
        };

        // 设备列表点击 (事件委托)
        deviceList.onclick = async (e) => {
            const item = e.target.closest('.device-item');
            if (!item) return;
            const index = parseInt(item.dataset.index, 10);
            const name = item.querySelector('.text-slate-200')?.textContent || 'Unknown';
            deviceList.innerHTML = `<div class="p-4 text-center text-cyan-400 text-sm">⏳ 正在连接设备 #${index + 1}: ${name}...</div>`;
            try {
                await deviceService.connectFromList(index);
                // 连接成功后 device:connected 事件会自动调用 enterMainApp()
            } catch (err) {
                let hint = '';
                if (err.name === 'NotAllowedError') {
                    hint = '<br><span class="text-xs">💡 设备被其他程序占用 (如 Bus Hound), 请关闭后重试</span>';
                } else if (err.name === 'NotFoundError') {
                    hint = '<br><span class="text-xs">💡 设备未找到, 请重新插拔 USB 后重试</span>';
                } else if (err.name === 'SecurityError') {
                    hint = '<br><span class="text-xs">💡 需要 HTTPS 或 localhost</span>';
                } else if (err.message && (err.message.includes('超时') || err.message.includes('timeout'))) {
                    hint = '<br><span class="text-xs">💡 连接超时 — 请关闭 Bus Hound 等 USB 监控工具后重试</span>';
                } else if (err.message && err.message.includes('Unable to open device')) {
                    hint = '<br><span class="text-xs">💡 设备被占用, 请关闭 Bus Hound 等工具后重试</span>';
                }
                deviceList.innerHTML = `<div class="p-4 text-center text-red-400 text-sm">❌ 连接失败: ${err.message}${hint}</div>`;
                logger.error('连接失败:', err);
            }
        };

        // 暴露关键对象到 window, 供普通 script 标签中的 directConnect 使用
        window.deviceService = deviceService;
        window.enterMainApp = enterMainApp;

        // 监听设备事件
        bus.on('device:connected', (data) => {
            console.log('[device:connected] 事件触发, data:', data);
            console.log('[device:connected] deviceService.deviceInfo:', deviceService.deviceInfo);
            updateStatusBadge('已连接', 'emerald-400', 'emerald-500');
            updateInfoPanel();
            updateSidebarFooter();
            protocol = deviceService.getProtocol();

            content: `<div id="testStatsContent" class="space-y-2 text-sm text-slate-400 text-center py-6">未开始</div>`,
        }).mount('#testStatsPanel');

        const testCountInput = new Input({
            label: '发送次数',
            type: 'number',
            value: 50,
            min: 1, max: 1000,
            suffix: '次',
        });
        testCountInput.mount('#testCountInput');

        const testIntervalInput = new Input({
            label: '间隔',
            type: 'number',
            value: 10,
            min: 5, max: 60000,
            suffix: 'ms',
        });
        testIntervalInput.mount('#testIntervalInput');

        new Select({
            label: '数据类型',
            options: [
                { value: 'increment', label: '递增' },
                { value: 'random', label: '随机' },
                { value: 'fixed', label: '固定' },
            ],
            value: 'increment',
        }).mount('#testDataTypeSelect');

        // 测试日志
        const testLogPanel = new Panel({
            title: '📝 测试日志',
            actions: [
                { label: '清空', onClick: () => {
                    testLogPanel.setContent(`<div class="text-sm text-slate-400 text-center py-4">日志已清空</div>`);
                }},
            ],
            content: `<div id="testLogContent" class="font-mono text-xs max-h-80 overflow-y-auto space-y-1 text-slate-400">等待测试开始...</div>`,
        });
        testLogPanel.mount('#testLogPanel');

        document.getElementById('btnTestStart').onclick = async () => {
            if (!test) return toast.warn('请先连接设备');
            try {
                await test.startTest({
                    sendCount: parseInt(testCountInput.getValue()) || 50,
                    interval: parseInt(testIntervalInput.getValue()) || 10,
                });
            } catch (err) {
                toast.error('测试失败: ' + err.message);
            }
        };

        document.getElementById('btnTestStop').onclick = () => {
            if (!test) return;
            test.stopTest();
            toast.info('已请求停止');
        };

        // ==================== PING 连通性测试 ====================
        document.getElementById('btnPingTest').onclick = async () => {
            if (!protocol) return toast.warn('请先连接设备');
            const pingResult = document.getElementById('pingResult');
            pingResult.classList.remove('hidden');
            pingResult.className = 'text-sm text-center py-2 text-cyan-400';
            pingResult.textContent = '⏳ 发送 PING...';

            const t0 = Date.now();
            try {
                const result = await protocol.send(CMD.PING, [0x01, 0x02, 0x03, 0x04]);
                const elapsed = Date.now() - t0;
                const hex = result.data.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
                pingResult.className = 'text-sm text-center py-2 text-emerald-400';
                pingResult.textContent = `✓ PING 成功 (${elapsed}ms) 回显: [${hex}]`;
                logger.info(`PING 成功: 延迟 ${elapsed}ms, 回显 [${hex}]`);
            } catch (err) {
                const elapsed = Date.now() - t0;
                pingResult.className = 'text-sm text-center py-2 text-red-400';
                pingResult.textContent = ` PING 失败 (${elapsed}ms): ${err.message}`;
                logger.error(`PING 失败: ${err.message}`);
            }
        };

        // ==================== 读取设备基本信息 ====================
        document.getElementById('btnDeviceInfo').onclick = async () => {
            if (!protocol) return toast.warn('请先连接设备');
            const pingResult = document.getElementById('pingResult');
            pingResult.classList.remove('hidden');
            pingResult.className = 'text-sm text-center py-2 text-cyan-400';
            pingResult.textContent = '⏳ 读取设备信息...';

            try {
                const result = await protocol.send(CMD.READ_BASIC_INFO, []);
                const hex = result.data.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
                pingResult.className = 'text-sm text-center py-2 text-emerald-400';
                pingResult.textContent = `✓ 设备信息 (${result.data.length}B): [${hex}]`;
                logger.info(`READ_BASIC_INFO 成功: [${hex}]`);
            } catch (err) {
                pingResult.className = 'text-sm text-center py-2 text-red-400';
                pingResult.textContent = `✗ 读取失败: ${err.message}`;
                logger.error(`READ_BASIC_INFO 失败: ${err.message}`);
            }
        };

        function setupServiceListeners() {
            if (!test) return;
            bus.on('test:progress', (e) => {
                const stats = test.getStats();
                document.getElementById('testStatsContent').innerHTML = `
                    <div class="grid grid-cols-2 gap-3 text-sm text-left">
                        <div><span class="text-slate-400">进度:</span> <span class="text-cyan-400">${e.current}/${e.total} (${e.percent}%)</span></div>
                        <div><span class="text-slate-400">成功:</span> <span class="text-emerald-400">${stats.success}</span></div>
                        <div><span class="text-slate-400">失败:</span> <span class="text-red-400">${stats.failed}</span></div>
                        <div><span class="text-slate-400">平均延迟:</span> <span class="text-cyan-400">${stats.avgLatency} ms</span></div>
                    </div>
                `;
            });
            bus.on('test:finished', (e) => {
                toast.success(`测试完成: 成功率 ${e.stats.successRate}%`);
            });
            bus.on('test:item-failed', (e) => {
                const logEl = document.getElementById('testLogContent');
                if (logEl) {
                    const time = new Date().toLocaleTimeString();
                    logEl.innerHTML = `<div class="text-red-400">[${time}] #${e.index} 失败: ${e.error}</div>` + logEl.innerHTML;
                }
            });
        }

        // ==================== 初始化 ====================
        ThemeToggle.mount('#themeToggle');
        toast.info('V3 架构已加载 - 11 个 UI 组件');
        logger.info('V3 application initialized');
    </script>

    <!-- ============================================================
         直接连接函数 — 必须在普通 <script> 标签中定义 (非 module)
         原因: Chrome 的 user gesture (transient activation) 在
         ES module 作用域中无法正确传递, 导致 navigator.hid
         .requestDevice() 不弹出设备选择器。
         原始 index.html 使用普通 <script> 标签, 无此问题。
         ============================================================ -->
    <script>
        // 与原始 index.html 的 directRequestDevice 完全一致:
        // requestDevice() 必须是第一个 await, 确保用户手势完整传递
        window.directConnect = async function() {
            var deviceList = document.getElementById('deviceList');
            if (!deviceList) return;

            if (!navigator.hid) {
                deviceList.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">❌ 浏览器不支持 WebHID (请使用 Chrome/Edge)</div>';
                return;
            }

            deviceList.innerHTML = '<div class="p-4 text-center text-cyan-400 text-sm">⏳ 正在请求设备权限...</div>';
            console.log('=== 开始直接连接设备 ===');

            try {
                // 先 getDevices() 获取已授权设备 (与"搜索设备"按钮相同的方式)
                var devices = await navigator.hid.getDevices();
                console.log('已授权设备数:', devices.length);

                // 过滤目标设备
                var filtered = [];
                for (var i = 0; i < devices.length; i++) {
                    if (devices[i].vendorId === 0x320F && devices[i].productId === 0x1234) {
                        filtered.push(devices[i]);
                    }
                }
                devices = filtered;
                console.log('目标设备数:', devices.length);

                // 没找到已授权设备, 弹出选择器
                if (devices.length === 0) {
                    console.log('未找到已授权设备, 弹出选择器...');
                    devices = await navigator.hid.requestDevice({
                        filters: [{ vendorId: 0x320F, productId: 0x1234 }]
                    });
                }

                if (devices.length === 0) {
                    throw new Error('未选择设备');
                }

                var device = devices[0];
                console.log('设备选择成功:', device.productName);

                // 等待 500ms 让设备准备就绪 (与原始 index.html 一致)
                await new Promise(function(resolve) { setTimeout(resolve, 500); });

                // 通过 DeviceService 连接
                if (window.deviceService) {
                    await window.deviceService.connectDevice(device);
                    // 连接成功后直接切换到主界面
                    if (window.enterMainApp) {
                        window.enterMainApp();
                    }
                } else {
                    deviceList.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">❌ 驱动未加载完成, 请刷新页面后重试</div>';
                }
            } catch (err) {
                console.error('请求设备失败:', err);
                var hint = '';
                if (err.message && (err.message.indexOf('超时') !== -1 || err.message.indexOf('timeout') !== -1)) {
                    hint = '<br><span class="text-xs"> 请求超时 — 请确保使用 Chrome/Edge 浏览器</span>';
                } else if (err.message && err.message.indexOf('Unable to open device') !== -1) {
                    hint = '<br><span class="text-xs">💡 设备被占用, 请关闭 Bus Hound 等工具后重试</span>';
                }
                deviceList.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">❌ 连接失败: ' + err.message + hint + '</div>';
            }
        };
    </script>
