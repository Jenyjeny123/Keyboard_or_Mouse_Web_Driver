<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI 组件库 - V2 架构</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0f; color: #e2e8f0; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(6, 182, 212, 0.2); }

        /* Slider 样式 */
        input[type="range"].slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        input[type="range"].slider::-webkit-slider-runnable-track {
            background: #334155;
            border-radius: 9999px;
        }
        input[type="range"].slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            border-radius: 9999px;
            background: #06b6d4;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }
        input[type="range"].slider::-moz-range-track {
            background: #334155;
            border-radius: 9999px;
        }
        input[type="range"].slider::-moz-range-thumb {
            border-radius: 9999px;
            background: #06b6d4;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="glass-panel p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-cyan-400 mb-2">🎨 UI 组件库</h1>
                    <p class="text-slate-400 text-sm">SwiftKey X1 V2 架构 - 11 个可复用 UI 组件</p>
                </div>
                <div id="themeToggle"></div>
            </div>
        </header>

        <!-- Tabs 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">📑 Tabs - 标签页</h2>
            <div id="tabsContainer"></div>
            <div id="tabsContent" class="mt-4 p-4 bg-slate-900/50 rounded-lg text-slate-300">
                当前选中: <span id="currentTab" class="text-cyan-400">lighting</span>
            </div>
        </div>

        <!-- Panel 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">📦 Panel - 面板</h2>
            <div id="panelContainer" class="space-y-4"></div>
        </div>

        <!-- Button 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">🔘 Button - 按钮</h2>
            <div class="space-y-4">
                <div>
                    <p class="text-sm text-slate-400 mb-2">变体 (Variant):</p>
                    <div class="flex flex-wrap gap-2" id="btnVariants"></div>
                </div>
                <div>
                    <p class="text-sm text-slate-400 mb-2">尺寸 (Size):</p>
                    <div class="flex flex-wrap items-center gap-2" id="btnSizes"></div>
                </div>
                <div>
                    <p class="text-sm text-slate-400 mb-2">图标与状态:</p>
                    <div class="flex flex-wrap gap-2" id="btnStates"></div>
                </div>
            </div>
        </div>

        <!-- Input 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">⌨️ Input - 输入框</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="inputContainer"></div>
        </div>

        <!-- Select 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">📋 Select - 下拉选择</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="selectContainer"></div>
        </div>

        <!-- Slider 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">🎚 Slider - 滑块</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="sliderContainer"></div>
        </div>

        <!-- Switch 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">🔛 Switch - 开关</h2>
            <div class="space-y-4" id="switchContainer"></div>
        </div>

        <!-- Modal 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">💬 Modal - 模态框</h2>
            <div class="flex gap-2">
                <button class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white" id="modalInfo">信息提示</button>
                <button class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white" id="modalSuccess">成功提示</button>
                <button class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white" id="modalDanger">危险操作</button>
                <button class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" id="modalCustom">自定义内容</button>
            </div>
        </div>

        <!-- Toast 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">🔔 Toast - 轻提示</h2>
            <div class="flex gap-2 flex-wrap">
                <button class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white" id="toastSuccess">Success</button>
                <button class="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 text-white" id="toastError">Error</button>
                <button class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" id="toastWarn">Warn</button>
                <button class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white" id="toastInfo">Info</button>
                <button class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300" id="toastClear">清空</button>
            </div>
        </div>

        <!-- Tooltip 演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">💡 Tooltip - 工具提示</h2>
            <p class="text-sm text-slate-400 mb-3">鼠标悬停查看效果</p>
            <div class="flex flex-wrap gap-3" id="tooltipContainer"></div>
        </div>

        <!-- 主题演示 -->
        <div class="glass-panel p-6 mb-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">🎨 Theme - 主题</h2>
            <div class="grid grid-cols-3 gap-3" id="themeList"></div>
            <p class="mt-4 text-slate-400 text-sm">当前: <span id="currentTheme" class="text-cyan-400"></span></p>
        </div>

        <!-- 事件日志 -->
        <div class="glass-panel p-6">
            <h2 class="text-xl font-bold text-cyan-300 mb-4">📝 事件日志</h2>
            <div id="logContainer" class="bg-slate-900/50 rounded-lg p-4 max-h-64 overflow-y-auto text-sm font-mono"></div>
        </div>
    </div>

    <script type="module">
        import { bus } from './src/core/EventBus.js';
        import { logger } from './src/core/Logger.js';
        import { Panel } from './src/ui/components/Panel.js';
        import { Modal, confirm } from './src/ui/components/Modal.js';
        import { toast } from './src/ui/components/Toast.js';
        import { Tabs } from './src/ui/components/Tabs.js';
        import { theme, ThemeToggle } from './src/ui/components/Theme.js';
        import { Button } from './src/ui/components/Button.js';
        import { Input } from './src/ui/components/Input.js';
        import { Select } from './src/ui/components/Select.js';
        import { Slider } from './src/ui/components/Slider.js';
        import { Switch } from './src/ui/components/Switch.js';
        import { Tooltip } from './src/ui/components/Tooltip.js';

        // 事件日志
        const logContainer = document.getElementById('logContainer');
        function addLog(msg, color = 'slate-300') {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `text-${color}`;
            line.textContent = `[${time}] ${msg}`;
            logContainer.appendChild(line);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // 监听所有事件
        ['button:clicked', 'input:input', 'input:change', 'input:blur',
         'select:change', 'slider:input', 'slider:change', 'switch:change',
         'modal:shown', 'modal:hidden', 'modal:confirmed', 'modal:cancelled',
         'toast:shown', 'toast:dismissed', 'tabs:changed', 'theme:changed',
         'tooltip:shown', 'tooltip:hidden'].forEach(evt => {
            bus.on(evt, (data) => addLog(`📢 ${evt}`, 'cyan-400'));
        });

        // ==================== Tabs ====================
        const tabs = new Tabs({
            tabs: [
                { id: 'lighting', label: '灯光', icon: '💡' },
                { id: 'keymap', label: '按键', icon: '⌨️', badge: '15' },
                { id: 'macro', label: '宏', icon: '🎬' },
                { id: 'performance', label: '性能', icon: '⚡' },
            ],
            active: 'lighting',
            onChange: (id) => {
                document.getElementById('currentTab').textContent = id;
            },
        });
        tabs.mount('#tabsContainer');

        // ==================== Panel ====================
        const panel1 = new Panel({
            title: '设备信息',
            subtitle: '显示当前连接的设备状态',
            actions: [
                { label: '刷新', onClick: () => toast.info('刷新设备信息') },
                { label: '断开', onClick: () => toast.warn('断开设备') },
            ],
            content: `
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div><span class="text-slate-400">名称:</span> <span class="text-cyan-400">SwiftKey X1</span></div>
                    <div><span class="text-slate-400">VID:</span> <span class="text-cyan-400">0x0000</span></div>
                    <div><span class="text-slate-400">PID:</span> <span class="text-cyan-400">0x0001</span></div>
                    <div><span class="text-slate-400">状态:</span> <span class="text-emerald-400">已连接</span></div>
                </div>
            `,
        });
        panel1.mount('#panelContainer');

        new Panel({
            title: '性能数据',
            variant: 'success',
            collapsible: true,
            content: `
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between"><span class="text-slate-400">轮询率</span><span class="text-cyan-400">1000 Hz</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">DPI</span><span class="text-cyan-400">1600</span></div>
                </div>
            `,
        }).mount('#panelContainer');

        // ==================== Button ====================
        ['primary', 'secondary', 'success', 'danger', 'warning', 'ghost', 'outline'].forEach(variant => {
            new Button({
                label: variant,
                variant,
                onClick: () => toast.info(`点击: ${variant}`),
            }).mount('#btnVariants');
        });

        ['sm', 'md', 'lg'].forEach(size => {
            new Button({
                label: `Size ${size}`,
                size,
                onClick: () => toast.info(`Size: ${size}`),
            }).mount('#btnSizes');
        });

        new Button({ label: '带图标', icon: '⚡', onClick: () => toast.info('图标按钮') }).mount('#btnStates');
        new Button({ label: '右侧图标', icon: '→', iconPosition: 'right', onClick: () => toast.info('右侧图标') }).mount('#btnStates');
        new Button({ label: '加载中', loading: true, onClick: () => {} }).mount('#btnStates');
        new Button({ label: '禁用', disabled: true, onClick: () => {} }).mount('#btnStates');
        new Button({ label: '全宽', fullWidth: true, onClick: () => toast.info('全宽按钮') }).mount('#btnStates');

        // ==================== Input ====================
        new Input({
            label: '用户名',
            placeholder: '请输入用户名',
            icon: '👤',
            showCounter: true,
            maxLength: 20,
            validator: (v) => v.length >= 3,
            errorMessage: '至少 3 个字符',
            onChange: (v) => addLog(`用户名: ${v}`, 'cyan-400'),
        }).mount('#inputContainer');

        new Input({
            label: '邮箱',
            type: 'email',
            placeholder: 'user@example.com',
            icon: '✉',
            hint: '请输入有效邮箱',
            validator: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
            errorMessage: '邮箱格式不正确',
        }).mount('#inputContainer');

        new Input({
            label: 'DPI 值',
            type: 'number',
            value: 1600,
            min: 100,
            max: 25600,
            step: 100,
            prefix: '🎯',
            suffix: 'DPI',
            showMinMax: true,
        }).mount('#inputContainer');

        new Input({
            label: '密码',
            type: 'password',
            placeholder: '请输入密码',
            icon: '🔒',
        }).mount('#inputContainer');

        // ==================== Select ====================
        new Select({
            label: '灯光模式',
            options: [
                { value: 'static', label: '静态', icon: '🔵' },
                { value: 'breathing', label: '呼吸', icon: '💨' },
                { value: 'wave', label: '波浪', icon: '🌊' },
                { value: 'rainbow', label: '彩虹', icon: '🌈' },
                { value: 'ripple', label: '涟漪', icon: '💧' },
                { value: 'reactive', label: '响应', icon: '⚡' },
            ],
            value: 'breathing',
            onChange: (v) => addLog(`灯光模式: ${v}`, 'cyan-400'),
        }).mount('#selectContainer');

        new Select({
            label: '轮询率 (可搜索)',
            searchable: true,
            options: [
                { value: '125', label: '125 Hz' },
                { value: '250', label: '250 Hz' },
                { value: '500', label: '500 Hz' },
                { value: '1000', label: '1000 Hz' },
                { value: '2000', label: '2000 Hz' },
                { value: '4000', label: '4000 Hz' },
                { value: '8000', label: '8000 Hz' },
            ],
            value: '1000',
        }).mount('#selectContainer');

        // ==================== Slider ====================
        new Slider({
            label: '亮度',
            min: 0, max: 100, value: 75,
            showValue: true, unit: '%',
            onChange: (v) => addLog(`亮度: ${v}%`, 'cyan-400'),
        }).mount('#sliderContainer');

        new Slider({
            label: '速度',
            min: 1, max: 10, value: 5,
            showValue: true, showMinMax: true,
            color: 'emerald',
        }).mount('#sliderContainer');

        new Slider({
            label: 'DPI',
            min: 100, max: 25600, value: 1600, step: 100,
            showValue: true, showMinMax: true,
            color: 'amber',
        }).mount('#sliderContainer');

        new Slider({
            label: '音量',
            min: 0, max: 100, value: 50,
            showValue: true, unit: ' dB',
            color: 'red',
        }).mount('#sliderContainer');

        // ==================== Switch ====================
        new Switch({
            label: '启用灯光',
            description: '关闭后所有 LED 将熄灭',
            value: true,
            color: 'cyan',
            onChange: (v) => addLog(`灯光: ${v}`, 'cyan-400'),
        }).mount('#switchContainer');

        new Switch({
            label: '游戏模式',
            description: '降低延迟, 禁用宏',
            value: false,
            color: 'emerald',
        }).mount('#switchContainer');

        new Switch({
            label: '宏录制',
            value: false,
            color: 'amber',
            size: 'sm',
            labelPosition: 'left',
        }).mount('#switchContainer');

        new Switch({
            label: '禁用状态',
            value: true,
            disabled: true,
            color: 'red',
        }).mount('#switchContainer');

        // ==================== Modal ====================
        document.getElementById('modalInfo').onclick = () => {
            const m = new Modal({ title: '提示', body: '这是一条信息提示', confirmText: '知道了', showCancel: false });
            m.mount('body'); m.show();
        };
        document.getElementById('modalSuccess').onclick = () => {
            const m = new Modal({ title: '操作成功', body: '灯光设置已成功应用。', confirmText: '完成', confirmVariant: 'success', showCancel: false });
            m.mount('body'); m.show();
        };
        document.getElementById('modalDanger').onclick = async () => {
            const ok = await confirm({ title: '危险操作', body: '此操作将恢复出厂设置, 是否继续?', confirmText: '确认恢复', confirmVariant: 'danger' });
            toast.show(ok ? '已恢复出厂设置' : '已取消', ok ? 'warn' : 'info');
        };
        document.getElementById('modalCustom').onclick = () => {
            const m = new Modal({
                title: '自定义内容',
                body: `<div class="space-y-3"><p>支持任意 HTML 内容</p><input type="text" placeholder="输入..." class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 text-white"></div>`,
                confirmText: '关闭', showCancel: false, width: 'max-w-lg',
            });
            m.mount('body'); m.show();
        };

        // ==================== Toast ====================
        document.getElementById('toastSuccess').onclick = () => toast.success('操作成功! ✓');
        document.getElementById('toastError').onclick = () => toast.error('操作失败! 请重试');
        document.getElementById('toastWarn').onclick = () => toast.warn('警告: 电量低');
        document.getElementById('toastInfo').onclick = () => toast.info('这是一条提示信息');
        document.getElementById('toastClear').onclick = () => toast.clear();

        // ==================== Tooltip ====================
        const tooltipBtns = [
            { label: '悬停 (Top)', content: '这是顶部提示', position: 'top' },
            { label: '悬停 (Bottom)', content: '这是底部提示', position: 'bottom' },
            { label: '悬停 (Left)', content: '这是左侧提示', position: 'left' },
            { label: '悬停 (Right)', content: '这是右侧提示', position: 'right' },
        ];
        tooltipBtns.forEach(cfg => {
            const btn = document.createElement('button');
            btn.className = 'px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300';
            btn.textContent = cfg.label;
            document.getElementById('tooltipContainer').appendChild(btn);
            new Tooltip({ target: btn, content: cfg.content, position: cfg.position });
        });

        // ==================== Theme ====================
        ThemeToggle.mount('#themeToggle');
        function renderThemeList() {
            const list = document.getElementById('themeList');
            list.innerHTML = '';
            theme.getAll().forEach(t => {
                const btn = document.createElement('button');
                btn.className = `p-4 rounded-lg border ${t.active ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-700 bg-slate-800/50'} transition-all hover:scale-105`;
                btn.innerHTML = `<div class="text-2xl mb-1">${t.icon}</div><div class="text-sm">${t.name}</div>`;
                btn.onclick = () => { theme.set(t.id); document.getElementById('currentTheme').textContent = t.name + ' ' + t.icon; renderThemeList(); };
                list.appendChild(btn);
            });
            const current = theme.getConfig();
            document.getElementById('currentTheme').textContent = current.name + ' ' + current.icon;
        }
        renderThemeList();

        addLog('组件库已加载 ✓ 共 11 个组件', 'emerald-400');
    </script>
</body>
</html>
